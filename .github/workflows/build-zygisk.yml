name: Build Hachimi Zygisk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Patch build script (arm64 only)
        run: sed -i '/copy_lib armv7-linux-androideabi armeabi-v7a/d' tools/android/build_zygisk.sh

      - name: Build Zygisk zip
        run: RELEASE=1 ./tools/android/build_zygisk.sh
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Zygisk zip
        uses: actions/upload-artifact@v7
        with:
          name: hachimi-zygisk
          path: build/zygisk-*.zip
